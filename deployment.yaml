apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-app-1
  labels:
    app: cicd-app-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-app-1
  template:
    metadata:
      labels:
        app: cicd-app-1
    spec:
      containers:
        - name: runimage-sha256-1
          image: gcr.io/nopedope-508108/gke-image:v3.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-app-1-service
  namespace: prod-space
spec:
  type: LoadBalancer
  selector:
    app: cicd-app-1
  ports:
    - port: 80
      targetPort: 8080
